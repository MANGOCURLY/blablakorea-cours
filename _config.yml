# 임시 주소 기준. blablakorea.fr 연결 시 url을 https://www.blablakorea.fr 로, baseurl을 "" 로 바꾸고 CNAME 파일을 추가한다.
url: https://mangocurly.github.io
baseurl: /blablakorea-cours
title: Blabla Korea
form_endpoint: ""
collections:
  articles_fr:
    output: true
    permalink: /notre-blog/:name/
defaults:
  - scope:
      path: ""
      type: articles_fr
    values:
      lang: fr
      layout: article
exclude:
  - README.md
